services:
  app:
    build: .
    init: true
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://iris:${POSTGRES_PASSWORD:-iris}@db:5432/iris
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iris}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 2s
      timeout: 3s
      retries: 15
